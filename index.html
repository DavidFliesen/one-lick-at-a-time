<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Lick at a Time — Learn Lead Guitar</title>
<meta name="description" content="Learn lead guitar one lick at a time. Explore blues, rock, metal, funk, jazz and more — hear each riff, see the tab, and build real playing skill.">
<meta name="theme-color" content="#130A16">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="One Lick">

<!-- Social preview -->
<meta property="og:title" content="One Lick at a Time — Learn Lead Guitar">
<meta property="og:description" content="Explore lead guitar one riff at a time. Hear it, see the tab, nail it.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/icon-512.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">

  <header>
    <img class="logo" src="assets/logo.svg" alt="One Lick at a Time — lead guitar, one riff at a time">
    <p class="sub">Explore lead guitar one riff at a time. Hear it, see the tab, feel the technique — then make it yours.</p>
  </header>

  <!-- Filters -->
  <nav class="filters" id="genreFilters" aria-label="Filter by genre"></nav>
  <nav class="filters" id="diffFilters" aria-label="Filter by difficulty"></nav>

  <!-- The lick card (rendered by app.js) -->
  <main class="card" id="card" aria-live="polite"></main>

  <!-- Deck navigation -->
  <div class="deck">
    <button class="pill nav" id="prev" aria-label="Previous lick"></button>
    <button class="pill nav" id="next" aria-label="Next lick"></button>
  </div>
  <div class="deck">
    <button class="pill nav" id="shuffle" aria-label="Surprise me"></button>
    <button class="pill nav" id="daily" aria-label="Lick of the day">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
      <span>Lick of the day</span>
    </button>
  </div>

  <!-- Progress -->
  <section class="progress" aria-label="Your progress">
    <div class="pgrid">
      <div class="stat"><div class="n" id="stExplored">0</div><div class="l">Explored</div></div>
      <div class="stat"><div class="n" id="stLearned">0</div><div class="l">Learned</div></div>
      <div class="stat"><div class="n" id="stTotal">0</div><div class="l">Total licks</div></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <p class="pgline" id="pgline"></p>
  </section>

  <!-- Share -->
  <section class="share" aria-label="Share">
    <div class="section-h">Share your progress</div>
    <div class="sharebtns">
      <button class="sh" id="shNative">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        <span>Share</span>
      </button>
      <button class="sh" id="shProgress">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>
        <span>My stats</span>
      </button>
      <button class="sh" id="shX" aria-label="Share on X"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18.9 2H22l-7.1 8.1L23.2 22h-6.6l-5.2-6.8L5.5 22H2.4l7.6-8.7L1 2h6.8l4.7 6.2L18.9 2Zm-1.2 18h1.8L7.1 3.9H5.2L17.7 20Z"/></svg><span>X</span></button>
      <button class="sh" id="shFb" aria-label="Share on Facebook"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 22 12Z"/></svg><span>Facebook</span></button>
      <button class="sh" id="shReddit" aria-label="Share on Reddit"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M22 11.8a2.1 2.1 0 0 0-3.6-1.4 10.3 10.3 0 0 0-5.2-1.6l.9-4.1 2.9.6a1.5 1.5 0 1 0 .2-1l-3.3-.7a.5.5 0 0 0-.6.4l-1 4.8a10.4 10.4 0 0 0-5.3 1.6A2.1 2.1 0 1 0 3.6 14a4 4 0 0 0 0 .6c0 3 3.5 5.4 7.9 5.4s7.9-2.4 7.9-5.4a4 4 0 0 0 0-.6 2.1 2.1 0 0 0 2.6-2.2ZM8 13.5A1.2 1.2 0 1 1 9.2 15 1.2 1.2 0 0 1 8 13.8Zm7 3.4a4.9 4.9 0 0 1-3 .9 4.9 4.9 0 0 1-3-.9.4.4 0 0 1 .6-.6 4.1 4.1 0 0 0 2.4.7 4.1 4.1 0 0 0 2.4-.7.4.4 0 1 1 .6.6Zm-.2-2.2A1.2 1.2 0 1 1 16 13.5a1.2 1.2 0 0 1-1.2 1.2Z"/></svg><span>Reddit</span></button>
      <button class="sh" id="shWa" aria-label="Share on WhatsApp"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1a8.3 8.3 0 0 1-4-2.4 8.7 8.7 0 0 1-1.7-2.6c-.2-.5-.4-1.2-.4-1.8 0-.6.3-1.2.6-1.5a.9.9 0 0 1 .7-.3h.5c.2 0 .4 0 .6.5l.7 1.7c.1.2 0 .4 0 .5l-.4.5c-.1.2-.3.3-.1.6a6.3 6.3 0 0 0 1.2 1.5 5.7 5.7 0 0 0 1.7 1c.3.2.5.1.6 0l.6-.8c.2-.3.4-.2.6-.1l1.6.8c.3.1.5.2.5.3.1.2.1.6-.1 1.2Z"/></svg><span>WhatsApp</span></button>
      <button class="sh" id="shTg" aria-label="Share on Telegram"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M21.9 4.3 18.7 20c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.2-8.3c.4-.4-.1-.6-.6-.2L6 13.2l-4.9-1.5c-1-.3-1-1 .2-1.5L20.6 2.9c.9-.3 1.6.2 1.3 1.4Z"/></svg><span>Telegram</span></button>
      <button class="sh" id="shCopy" aria-label="Copy link"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg><span>Copy link</span></button>
    </div>
  </section>

  <footer>
    <p>Made for players who want to <b>lead</b>. Practice a little every day.</p>
    <p>All licks are original teaching phrases — free to learn, free to share.</p>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/licks.js"></script>
<script src="js/audio.js"></script>
<script src="js/tab.js"></script>
<script src="js/app.js"></script>
</body>
</html>
