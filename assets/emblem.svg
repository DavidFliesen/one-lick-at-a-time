<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="One Lick at a Time emblem">
  <defs>
    <linearGradient id="hot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC24B"/>
      <stop offset="34%" stop-color="#FF9E2C"/>
      <stop offset="66%" stop-color="#FF5A3C"/>
      <stop offset="100%" stop-color="#FF3D8B"/>
    </linearGradient>
    <linearGradient id="hotV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD470"/>
      <stop offset="50%" stop-color="#FF7A2E"/>
      <stop offset="100%" stop-color="#FF3D8B"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#FF7A2E" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FF3D8B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF3D8B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <circle cx="256" cy="236" r="200" fill="url(#halo)"/>

  <!-- stage-light rays: symmetric burst behind the pick -->
  <g opacity="0.7" filter="url(#soft)" fill="url(#hotV)">
    <g transform="rotate(0 256 236)"><path d="M256 236 L243 8 L269 8 Z"/></g>
    <g transform="rotate(34 256 236)"><path d="M256 236 L246 26 L266 26 Z"/></g>
    <g transform="rotate(-34 256 236)"><path d="M256 236 L246 26 L266 26 Z"/></g>
    <g transform="rotate(64 256 236)"><path d="M256 236 L247 44 L265 44 Z"/></g>
    <g transform="rotate(-64 256 236)"><path d="M256 236 L247 44 L265 44 Z"/></g>
    <g transform="rotate(90 256 236)"><path d="M256 236 L248 70 L264 70 Z"/></g>
    <g transform="rotate(-90 256 236)"><path d="M256 236 L248 70 L264 70 Z"/></g>
  </g>

  <!-- guitar pick body -->
  <g>
    <path d="M256 120
             C316 120 372 150 388 208
             C400 252 378 320 328 384
             C300 420 274 442 256 448
             C238 442 212 420 184 384
             C134 320 112 252 124 208
             C140 150 196 120 256 120 Z"
          fill="url(#hotV)"/>
    <!-- inner bevel -->
    <path d="M256 120
             C316 120 372 150 388 208
             C400 252 378 320 328 384
             C300 420 274 442 256 448
             C238 442 212 420 184 384
             C134 320 112 252 124 208
             C140 150 196 120 256 120 Z"
          fill="none" stroke="#2A0E1E" stroke-opacity="0.35" stroke-width="6"/>

    <!-- six strings across the pick -->
    <g stroke="#2A0E1E" stroke-opacity="0.28">
      <line x1="150" y1="196" x2="362" y2="196" stroke-width="2.5"/>
      <line x1="146" y1="228" x2="366" y2="228" stroke-width="3"/>
      <line x1="150" y1="260" x2="362" y2="260" stroke-width="3.5"/>
      <line x1="160" y1="292" x2="352" y2="292" stroke-width="4"/>
      <line x1="176" y1="324" x2="336" y2="324" stroke-width="4.5"/>
      <line x1="198" y1="356" x2="314" y2="356" stroke-width="5"/>
    </g>
  </g>

  <!-- lightning bolt cut-through -->
  <path d="M286 150
           L206 274
           L252 274
           L224 402
           L332 244
           L282 244
           L318 150 Z"
        fill="#160810"/>
  <path d="M283 158
           L216 268
           L258 268
           L232 384
           L322 250
           L276 250
           L308 160 Z"
        fill="url(#hot)"/>
</svg>
